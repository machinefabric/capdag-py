[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "capdag"
version = "1.324.48"
description = "Core capability URN and definition system for CapDAG"
readme = "README.md"
authors = [{name = "https://github.com/machinefabric"}]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
	"opsx-py>=1.21.119",
    "tagged-urn>=1.27.122",
    "cbor2>=5.4.0",
	"python-pest>=0.1.1",
    # The fabric registry is an HTTP client; the CLI has no offline-only mode.
    "httpx>=0.24",
]

[project.scripts]
# The Python mirror's CLI. `capdag new` is how a cartridge project comes into
# existence, and every mirror creates the same project — so every mirror ships
# the command.
capdag = "capdag.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.setuptools.package-data]
"capdag.machine" = ["*.pest"]
